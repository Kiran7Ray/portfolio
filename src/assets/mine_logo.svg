<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#bgGlow)"/>

  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <path d="M 0,100 L 500,100 M 0,200 L 500,200 M 0,300 L 500,300 M 0,400 L 500,400"/>
    <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500"/>
  </g>

  <g transform="translate(10, -15)">
    <path d="M 195 130 
             L 135 210 
             L 195 290" 
          fill="none" 
          stroke="url(#codeGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#softGlow)"/>

    <path d="M 185 210 
             L 265 130" 
          fill="none" 
          stroke="url(#codeGrad)" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <path d="M 185 210 
             L 265 290" 
          fill="none" 
          stroke="url(#codeGrad)" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <path d="M 270 130 
             C 345 130, 345 210, 270 210 
             L 270 290" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#softGlow)"/>

    <rect x="335" y="272" width="18" height="18" rx="4" fill="url(#codeGrad)"/>
  </g>

  <text x="250" y="395" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="5">
    KIRAN PHUYAL
  </text>

  <text x="250" y="425" 
        text-anchor="middle" 
        fill="#64748b" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="7">
    DEVELOPER &amp; DESIGNER
  </text>
</svg>
